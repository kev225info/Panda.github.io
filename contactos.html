<main class="container mt-4">
  <h2>Formulario de Inscripción</h2>
  <form>
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre:</label>
      <input type="text" id="nombre" class="form-control" name="nom">
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label">Correo:</label>
      <input type="email" id="correo" class="form-control" name="correo">
    </div>

    <div class="mb-3">
      <label for="ciudad" class="form-label">Ciudad:</label>
      <select class="form-select" name="ciudad" id="ciudad">
        <option>La Paz</option>
        <option>Cochabamba</option>
        <option>Santa Cruz</option>
        <option>Oruro</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="coment" class="form-label">Comentarios:</label>
      <textarea name="coment" class="form-control" rows="5"></textarea>
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="promo" name="promo">
      <label class="form-check-label" for="promo">Enviar promociones por correo</label>
    </div>

    <button type="submit" class="btn btn-primary">Aceptar</button>
  </form>
</main>
